[project]
name = "avar-dub"
version = "0.1.0"
description = "Experimental, non-commercial Russian-to-Avar video dubbing pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "soundfile>=0.12,<1",
    "noisereduce>=3.0,<4",
    "imageio-ffmpeg>=0.5,<1",
    "faster-whisper>=1.1,<2",
]

[tool.uv]
package = false
